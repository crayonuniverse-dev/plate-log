<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>식단 카메라</title>
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* VOICE everyday, calm and clean
   IDEA a quiet onboarding-style app: one coral blob, lots of air, sage ground
   PICTURE the stamped photo in a white card; the blob sits above the question
   COLOUR sage #EEF3EA ground, white cards, ink #1F2420, coral #FF6B5B accent, dark sage buttons
   TYPE Pretendard only (800 / 600 / 400)
   LAYOUT phone: blob + question, photo card, buttons, settings; wide: left column intro + settings, right photo */
:root{--bg:#EEF1EC;--card:#FFFFFF;--ink:#1F2420;--sub:#6B746A;--line:#DCE5D6;--chip:#E2EBDD;--btn:#4E5A4C;--btnInk:#FFFFFF;--accent:#2D4BFF;--green:#2FB45A}
@media(prefers-color-scheme:dark){:root{--bg:#141815;--card:#1D221E;--ink:#EEF2EC;--sub:#9AA597;--line:#2C332D;--chip:#262D27;--btn:#DDE6D8;--btnInk:#1A1F1B;--accent:#6E86FF}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Pretendard,-apple-system,system-ui,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.page{max-width:1040px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);padding-left:max(5vw,20px,env(safe-area-inset-left,0px));padding-right:max(5vw,20px,env(safe-area-inset-right,0px));display:grid;gap:20px;grid-template-areas:"intro" "pick" "prev" "box" "hist"}
.intro{grid-area:intro;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px;padding-top:8px}
.date{margin:0 0 12px;font-weight:500;font-size:13px;color:var(--sub);letter-spacing:-.01em}
.date b{font-weight:200;font-size:13px;color:var(--sub);margin:0 6px}
.blob{width:118px;height:118px;cursor:pointer;margin-right:-6px}
.blob svg{width:100%;height:100%;display:block}
.blob.hop svg{animation:hop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{0%{transform:translateY(8px) scale(.94)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.blob.hop svg{animation:none}}
h1{margin:0;font-size:clamp(30px,8.8vw,42px);line-height:1.16;letter-spacing:-.035em}
h1 .l{display:block;font-weight:200}
h1 .b{display:block;font-weight:600}
.prev{grid-area:prev}
.stage{background:var(--card);border-radius:20px;padding:8px;position:relative;box-shadow:0 1px 0 var(--line)}
.stage img{display:block;width:100%;height:auto;max-height:66svh;object-fit:contain;border-radius:14px}
.tag{position:absolute;top:18px;left:18px;background:rgba(31,36,32,.72);color:#fff;font-weight:600;font-size:12px;padding:3px 10px;border-radius:99px}
.acts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:54px;border-radius:14px;font:500 16px Pretendard,system-ui,sans-serif;text-decoration:none;cursor:pointer;border:0;padding:0 20px;color:var(--ink);background:var(--card)}
.btn.main{background:var(--btn);color:var(--btnInk)}
.btn:active{opacity:.85}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.hint{font-size:13px;font-weight:300;color:var(--sub);margin:10px 2px 0;text-align:center}
.hist{grid-area:hist;padding-top:12px}
.hist h2{margin:0;font-size:26px;line-height:1.2;letter-spacing:-.035em;font-weight:600}
.hist h2 span{font-weight:200}
.hsub{margin:6px 0 0;font-size:13px;font-weight:300;color:var(--sub)}
.day{margin-top:22px}
.day h3{margin:0 0 10px;font-size:14px;font-weight:500;letter-spacing:-.01em}
.day h3 b{font-weight:200;color:var(--sub);margin:0 6px}
.day h3 em{font-style:normal;font-weight:300;color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:6px;border:2px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card[aria-current=true]{border-color:var(--accent)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.card .t{display:flex;gap:6px;align-items:baseline;padding:7px 4px 2px;white-space:nowrap}
.card .t span{font-weight:200;font-size:19px;letter-spacing:-.02em}
.card .t b{font-weight:600;font-size:13px}
.empty{margin-top:16px;background:var(--card);border-radius:16px;padding:18px;font-weight:300;color:var(--sub);font-size:14px}
.del{color:#C0392B;width:100%}
.pics{display:grid;gap:8px;margin-top:10px}
.prow{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.arow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pic{position:relative;flex:0 0 auto;width:60px;height:60px;border-radius:12px;overflow:hidden;background:var(--card)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(20,24,21,.7);color:#fff;font:300 14px/22px Pretendard,sans-serif;padding:0;cursor:pointer}
.add{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:50px;border-radius:12px;border:1px dashed var(--sub);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;padding:0 10px;line-height:1.25;text-align:center}
.add small{font-weight:300;color:var(--sub);font-size:11px}
.add input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.card .ph{position:relative}
.card .n{position:absolute;right:6px;bottom:6px;background:rgba(20,24,21,.72);color:#fff;font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px}
.pick{grid-area:pick;display:grid;gap:8px}
.pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.box{grid-area:box;background:var(--card);border-radius:20px;padding:20px;display:grid;gap:20px}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:500;font-size:14px;margin-bottom:10px}
.lab em{font-style:normal;font-weight:300;color:var(--sub);font-size:13px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chips button{min-height:44px;border-radius:12px;border:0;background:var(--chip);color:var(--sub);font:300 15px Pretendard,system-ui,sans-serif;cursor:pointer;padding:0}
.chips button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
input[type=datetime-local],input[type=text]{width:100%;min-height:48px;font:300 16px Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px}
input:focus-visible,button:focus-visible,.btn:focus-visible,.pick label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost{min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--sub);font:300 14px Pretendard,system-ui,sans-serif;cursor:pointer}
.err{background:#FFE9E6;color:#B3261E;border-radius:12px;padding:10px 12px;font-size:14px}
@media(min-width:760px){
  .page{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-areas:"intro prev" "pick prev" "box prev" "hist hist";align-items:start;column-gap:32px;padding-top:48px}
  .prev{position:sticky;top:24px}
  h1{font-size:44px}
}
</style>
</head>
<body>
<div class="page">
  <section class="intro">
    <div class="itext">
      <p class="date" id="today"></p>
      <h1><span class="l">오늘 <span id="hlMeal">점심</span>,</span><span class="b">뭐 먹었어요?</span></h1>
    </div>
    <div class="blob" id="blob" role="img" aria-label="캐릭터"></div>
  </section>

  <section class="prev">
    <div class="stage">
      <img id="out" alt="시간이 표시된 식단 사진">
      <span class="tag" id="sampleTag">예시</span>
    </div>
    <div class="pics" id="pics" hidden></div>
    <div class="acts">
      <button class="btn main" id="shareBtn" type="button">클로드로 보내기</button>
      <a class="btn" id="saveBtn" download="식단.jpg" href="#">저장</a>
    </div>
    <p class="hint" id="actHint">보내기를 누르고 공유 목록에서 Claude를 선택하세요</p>
  </section>

  <div class="pick">
    <label class="btn main">사진 찍기<input id="camIn" type="file" accept="image/*" capture="environment"></label>
    <label class="btn">갤러리에서 선택<input id="galIn" type="file" accept="image/*" multiple></label>
  </div>

  <div class="box">
    <div><div class="lab">끼니 <em>시간에 맞춰 자동 선택</em></div><div class="chips" id="meals"></div></div>
    <div><div class="lab">먹은 시간 <em id="srcNote"></em></div><input id="when" type="datetime-local" step="60"></div>
    <div><div class="lab">메모 <em>선택</em></div><input id="memo" type="text" maxlength="40" placeholder="현미밥 반 공기, 외식" autocomplete="off"></div>
    <div class="row"><button class="ghost" id="nowBtn" type="button">지금 시간으로</button><button class="ghost" id="resetBtn" type="button">원래 시간으로</button></div>
    <button class="ghost del" id="delBtn" type="button" hidden>이 기록 삭제</button>
    <div class="err" id="err" hidden></div>
  </div>

  <section class="hist">
    <h2><span>내 식단</span> 기록</h2>
    <p class="hsub">사진은 이 폰의 앱 안에만 보관돼요. 갤러리에는 저장되지 않고, 30일이 지나면 자동으로 정리돼요.</p>
    <div id="histList"></div>
  </section>
</div>

<script>
{
const MEALS=['아침','점심','간식','저녁','야식'],DAYS=['일','월','화','수','목','금','토'];
const INK='#1F2420';
const $=id=>document.getElementById(id);
const out=$('out'),histList=$('histList'),memo=$('memo'),when=$('when'),err=$('err'),blob=$('blob');
let items=[],cur=0,outURL=null,outBlob=null,mood='';

/* cobalt bean, 120x120: flat body, half-lidded eyes, green accent; mood moves the lids */
const BLUE='#2D4BFF',GREEN='#2FB45A';
const LIDS={cool:[[-2,-3],[-3,-2]],sleep:[[6,6],[6,6]],happy:[[-17,-17],[-17,-17]]};
function blobParts(m){
  const L=LIDS[m]||LIDS.cool;
  return[
   ['c',34,32,15,BLUE],
   ['p','M20 68 C16 38 38 16 62 18 C88 20 106 38 104 64 C102 94 80 108 56 106 C32 104 22 92 20 68Z',BLUE],
   ['p','M30 92 C44 104 74 106 90 94 C80 104 66 108 54 107 C42 106 34 100 30 92Z','#1F36C9'],
   ['eye',46,62,12,14,L[0],[52,67]],
   ['eye',77,60,12,14,L[1],[83,65]],
   ['e',44,15,5,10,GREEN,-38],['p','M38 20 Q37 24 35 26','#1F36C9']
  ];
}
const lidPath=(cx,cy,rx,ry,l)=>`M${cx-rx-2} ${cy-ry-2} H${cx+rx+2} V${cy+l[1]} L${cx-rx-2} ${cy+l[0]} Z`;
let uid=0;
const svgBlob=m=>{const id='k'+(uid++);return'<svg viewBox="0 0 120 120" aria-hidden="true">'+blobParts(m).map((p,i)=>{
  if(p[0]==='c')return`<circle cx="${p[1]}" cy="${p[2]}" r="${p[3]}" fill="${p[4]}"/>`;
  if(p[0]==='e')return`<ellipse cx="${p[1]}" cy="${p[2]}" rx="${p[3]}" ry="${p[4]}" fill="${p[5]}" transform="rotate(${p[6]||0} ${p[1]} ${p[2]})"/>`;
  if(p[0]==='p')return`<path d="${p[1]}" fill="${p[2]}"/>`;
  const [,cx,cy,rx,ry,l,pp]=p;
  return`<clipPath id="${id}${i}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff"/><g clip-path="url(#${id}${i})"><circle cx="${pp[0]}" cy="${pp[1]}" r="5.4" fill="#111"/><path d="${lidPath(cx,cy,rx,ry,l)}" fill="#111"/></g>`;
}).join('')+'</svg>'};
function drawBlob(x,m,ox,oy,size){
  const s=size/120;x.save();x.translate(ox,oy);x.scale(s,s);
  for(const p of blobParts(m)){
    x.beginPath();
    if(p[0]==='c'){x.arc(p[1],p[2],p[3],0,Math.PI*2);x.fillStyle=p[4];x.fill()}
    else if(p[0]==='e'){x.ellipse(p[1],p[2],p[3],p[4],(p[6]||0)*Math.PI/180,0,Math.PI*2);x.fillStyle=p[5];x.fill()}
    else if(p[0]==='p'){x.fillStyle=p[2];x.fill(new Path2D(p[1]))}
    else{const [,cx,cy,rx,ry,l,pp]=p;x.save();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.clip();
      x.beginPath();x.arc(pp[0],pp[1],5.4,0,Math.PI*2);x.fillStyle='#111';x.fill();x.fill(new Path2D(lidPath(cx,cy,rx,ry,l)));x.restore()}
  }
  x.restore();
}
const moodOf=meal=>meal==='야식'?'sleep':'cool';
function setBlob(m){if(m===mood)return;mood=m;blob.innerHTML=svgBlob(m);hop()}
function hop(){blob.classList.remove('hop');void blob.offsetWidth;blob.classList.add('hop')}
blob.addEventListener('click',hop);

const autoMeal=d=>{const h=d.getHours();if(h>=5&&h<10)return'아침';if(h>=10&&h<15)return'점심';if(h>=15&&h<17)return'간식';if(h>=17&&h<21)return'저녁';return'야식'};
const pad=n=>String(n).padStart(2,'0');
const toLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fname=it=>{const d=it.date;return`식단_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}_${it.meal}.jpg`};

$('meals').innerHTML=MEALS.map(m=>`<button type="button" data-m="${m}" aria-pressed="false">${m}</button>`).join('');
{const n=new Date();$('today').innerHTML=`${n.getMonth()+1}월 ${n.getDate()}일<b>/</b>${DAYS[n.getDay()]}요일`}

function exifDate(buf){
  try{
    const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o<v.byteLength-4){
      const m=v.getUint16(o);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949;
        const g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
        const read=ifd=>{const n=g16(ifd),r={};for(let i=0;i<n;i++){const e=ifd+2+i*12;r[g16(e)]=e}return r};
        const str=e=>{const c=g32(e+4),off=c>4?t+g32(e+8):e+8;let s='';for(let i=0;i<c-1;i++)s+=String.fromCharCode(v.getUint8(off+i));return s};
        const a=read(t+g32(t+4));let dt=null;
        if(a[0x8769]){const ex=read(t+g32(a[0x8769]+8));if(ex[0x9003])dt=str(ex[0x9003]);else if(ex[0x9004])dt=str(ex[0x9004])}
        if(!dt&&a[0x0132])dt=str(a[0x0132]);
        const k=dt&&dt.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);
        return k?new Date(+k[1],k[2]-1,+k[3],+k[4],+k[5]):null;
      }
      if((m&0xFF00)!==0xFF00)break;
      o+=2+v.getUint16(o+2);
    }
  }catch(e){}
  return null;
}
const loadUrl=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
const KEEP_DAYS=30;
/* IndexedDB: one record per meal photo (resized original + meta); stamp is redrawn on view */
let dbp=null;
const db=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('meal-camera',1);r.onupgradeneeded=()=>r.result.createObjectStore('meals',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
const tx=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('meals',mode),st=t.objectStore('meals'),r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
const dbAll=()=>tx('readonly',st=>st.getAll());
const dbPut=rec=>tx('readwrite',st=>st.put(rec)).catch(()=>{});
const dbDel=id=>tx('readwrite',st=>st.delete(id)).catch(()=>{});
const rec=it=>({id:it.id,created:it.created,date:+it.date,orig:+it.orig,meal:it.meal,memo:it.memo,src:it.src,blobs:it.blobs});
const fromRec=r=>{const blobs=r.blobs||[r.blob];return{...r,blobs,date:new Date(r.date),orig:new Date(r.orig),urls:blobs.map(b=>URL.createObjectURL(b)),imgs:null,comp:null}};
const MAXP=6,GAP=30*60e3;
let pt;const persist=it=>{if(it.sample)return;clearTimeout(pt);pt=setTimeout(()=>dbPut(rec(it)),300)};
const resize=img=>new Promise(res=>{const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.88)});
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const sortItems=()=>items.sort((a,b)=>b.date-a.date);

function sampleImg(){
  const c=document.createElement('canvas');c.width=1200;c.height=1000;const x=c.getContext('2d');
  x.fillStyle='#E4E9DF';x.fillRect(0,0,1200,1000);
  x.fillStyle='rgba(0,0,0,.08)';x.beginPath();x.ellipse(615,515,390,340,0,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.ellipse(600,500,390,340,0,0,7);x.fill();
  x.fillStyle='#F4F5F2';x.beginPath();x.ellipse(600,500,305,262,0,0,7);x.fill();
  x.fillStyle='#FBF8F0';x.beginPath();x.ellipse(470,440,130,105,0,0,7);x.fill();
  for(let i=0;i<50;i++){x.fillStyle=i%3?'#EDE6D2':'#9C8166';x.beginPath();x.ellipse(380+((i*37)%180),370+((i*53)%140),9,5,i,0,7);x.fill()}
  x.fillStyle='#EFB083';x.beginPath();x.moveTo(600,510);x.quadraticCurveTo(770,430,830,540);x.quadraticCurveTo(720,650,600,510);x.fill();
  const g=['#7FA36F','#93B883','#6A8F5C'];
  for(let i=0;i<26;i++){x.fillStyle=g[i%3];x.beginPath();x.ellipse(520+((i*29)%170),610+((i*41)%90),34,18,i*.7,0,7);x.fill()}
  x.fillStyle='#FF6B5B';x.beginPath();x.arc(560,640,20,0,7);x.fill();x.beginPath();x.arc(640,660,18,0,7);x.fill();
  return c;
}

const F='Pretendard,-apple-system,system-ui,sans-serif';
/* several photos of one meal -> one picture: rows of up to 2 (3 when 5+), last row stretches */
function collage(imgs){
  if(imgs.length===1)return imgs[0];
  const n=imgs.length,cols=n<=4?2:3,rows=Math.ceil(n/cols),W=1600,g=8,cell=Math.round((W-g*(cols-1))/cols);
  const c=document.createElement('canvas');c.width=W;c.height=rows*cell+(rows-1)*g;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  let k=0;
  for(let r=0;r<rows;r++){
    const cnt=Math.min(cols,n-r*cols),cw=(W-g*(cnt-1))/cnt,y=r*(cell+g);
    for(let i=0;i<cnt;i++,k++){
      const im=imgs[k],iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,sc=Math.max(cw/iw,cell/ih),sw=cw/sc,sh=cell/sc;
      x.drawImage(im,(iw-sw)/2,(ih-sh)/2,sw,sh,i*(cw+g),y,cw,cell);
    }
  }
  return c;
}
function draw(it){
  const img=it.sample?it.img:(it.comp||(it.comp=collage(it.imgs))),w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const s=Math.min(1,1600/Math.max(w,h)),Wd=Math.round(w*s),H=Math.round(h*s);
  const u=Math.max(Wd,H*.75)/100,memoTxt=it.memo.trim();
  const bar=Math.round(u*17+(memoTxt?u*5.5:0));
  const c=document.createElement('canvas');c.width=Wd;c.height=H+bar;
  const x=c.getContext('2d');
  x.drawImage(img,0,0,Wd,H);
  x.fillStyle='#FFFFFF';x.fillRect(0,H,Wd,bar);
  const d=it.date,p=u*5,base=H+u*12;
  x.textBaseline='alphabetic';x.fillStyle=INK;
  x.font=`200 ${u*11}px ${F}`;
  const tm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;x.fillText(tm,p,base);
  const tw=x.measureText(tm).width,dx=p+tw+u*3.6;
  x.fillStyle='#2D4BFF';x.fillRect(dx-u*1.8,base-u*8.2,Math.max(1,u*.25),u*8.2);
  x.fillStyle=INK;x.font=`600 ${u*4.4}px ${F}`;x.fillText(it.meal,dx,base-u*4.4);
  x.font=`300 ${u*3.3}px ${F}`;x.fillStyle='#6B746A';
  x.fillText(`${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`,dx,base);
  const bs=u*14;drawBlob(x,moodOf(it.meal),Wd-p-bs+u*1.5,H+u*1.4,bs);
  if(memoTxt){x.fillStyle='#4A5249';x.font=`300 ${u*3.6}px ${F}`;x.fillText(memoTxt,p,H+u*19,Wd-p*2)}
  c.toBlob(b=>{if(!b)return;if(outURL)URL.revokeObjectURL(outURL);outBlob=b;outURL=URL.createObjectURL(b);out.src=outURL;const sv=$('saveBtn');sv.href=outURL;sv.download=fname(it)},'image/jpeg',.9);
}

function renderHist(){
  const real=items.filter(i=>!i.sample);
  if(!real.length){histList.innerHTML='<div class="empty">아직 기록이 없어요. 첫 끼니를 찍어 보세요.</div>';return}
  const today=dayKey(new Date()),groups=[];
  for(const it of real){const k=dayKey(it.date);let g=groups[groups.length-1];if(!g||g.k!==k)groups.push(g={k,d:it.date,list:[]});g.list.push(it)}
  histList.innerHTML=groups.map(g=>`<div class="day"><h3>${g.k===today?'오늘':`${g.d.getMonth()+1}월 ${g.d.getDate()}일`}<b>/</b>${DAYS[g.d.getDay()]}요일 <em>· ${g.list.length}끼</em></h3><div class="cards">`+
    g.list.map(it=>`<button class="card" type="button" data-id="${it.id}" aria-current="${it===items[cur]}"><div class="ph"><img src="${it.urls[0]}" alt="" loading="lazy">${it.urls.length>1?`<span class="n">${it.urls.length}장</span>`:''}</div><div class="t"><span>${pad(it.date.getHours())}:${pad(it.date.getMinutes())}</span><b>${it.meal}</b></div></button>`).join('')+'</div></div>').join('');
}
let delArm=false;
async function show(){
  const it=items[cur];if(!it)return;
  if(!it.sample&&!it.imgs){try{it.imgs=await Promise.all(it.urls.map(loadUrl));it.comp=null}catch(e){return}}
  const pics=$('pics');pics.hidden=!!it.sample;
  if(!it.sample)pics.innerHTML='<div class="prow">'+it.urls.map((u,i)=>`<div class="pic"><img src="${u}" alt="">${it.urls.length>1?`<button type="button" data-rm="${i}" aria-label="${i+1}번째 사진 빼기">×</button>`:''}</div>`).join('')+'</div>'+
    (it.urls.length<MAXP?`<div class="arow"><label class="add">+ 찍어서 추가<small>이 끼니에</small><input type="file" accept="image/*" capture="environment" data-add="cam"></label><label class="add">+ 갤러리에서<small>이 끼니에</small><input type="file" accept="image/*" multiple data-add="gal"></label></div>`:'');
  delArm=false;$('delBtn').textContent='이 기록 삭제';$('delBtn').hidden=!!it.sample;
  renderHist();
  $('hlMeal').textContent=it.meal;
  setBlob(moodOf(it.meal));
  document.querySelectorAll('#meals button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===it.meal));
  when.value=toLocal(it.date);memo.value=it.memo;
  $('srcNote').textContent=it.src;
  $('sampleTag').hidden=!it.sample;
  $('shareBtn').setAttribute('aria-disabled',!!it.sample);$('saveBtn').setAttribute('aria-disabled',!!it.sample);
  draw(it);
}

async function addFiles(files,fromCam,target){
  err.hidden=true;const ph=[];let bad=0;
  for(const f of files){
    const fu=URL.createObjectURL(f);let img;try{img=await loadUrl(fu)}catch(e){URL.revokeObjectURL(fu);bad++;continue}
    const blob=await resize(img);URL.revokeObjectURL(fu);if(!blob){bad++;continue}
    let d=null,src;
    try{d=exifDate(await f.slice(0,262144).arrayBuffer())}catch(e){}
    if(d)src='사진 촬영 시간';
    else if(fromCam){d=new Date();src='지금 찍은 시간'}
    else{d=new Date(f.lastModified||Date.now());src='파일 시간 · 확인 필요'}
    ph.push({blob,d,src});
  }
  if(bad){err.textContent=`열 수 없는 사진이 ${bad}장 있어요. 카메라 설정에서 '고효율 사진(HEIF)'을 끄고 다시 찍어 주세요.`;err.hidden=false}
  if(!ph.length)return;
  ph.sort((a,b)=>a.d-b.d);
  if(target&&!target.sample){
    const room=MAXP-target.blobs.length,take=ph.slice(0,room);
    for(const p of take){target.blobs.push(p.blob);target.urls.push(URL.createObjectURL(p.blob))}
    target.imgs=null;target.comp=null;dbPut(rec(target));
    if(ph.length>room){err.textContent=`한 끼에는 사진을 ${MAXP}장까지 넣을 수 있어요.`;err.hidden=false}
    show();return;
  }
  /* gallery picks: photos taken within 30 min of each other become one meal */
  const groups=[];
  for(const p of ph){const g=groups[groups.length-1];if(g&&p.d-g[g.length-1].d<=GAP&&g.length<MAXP)g.push(p);else groups.push([p])}
  const added=groups.map(g=>{const d=g[0].d,blobs=g.map(p=>p.blob);
    const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),created:Date.now(),date:d,orig:new Date(d),meal:autoMeal(d),memo:'',src:g[0].src,blobs,urls:blobs.map(b=>URL.createObjectURL(b)),imgs:null,comp:null};
    dbPut(rec(it));return it});
  const last=added.reduce((a,b)=>b.date>a.date?b:a);
  items=items.filter(i=>!i.sample).concat(added);sortItems();cur=items.indexOf(last);show();
  if(added.length>1&&!bad){err.textContent=`사진 ${ph.length}장을 찍은 시간 기준으로 ${added.length}끼로 나눴어요.`;err.hidden=false}
}
$('pics').addEventListener('change',e=>{const t=e.target;if(!t.dataset.add)return;const it=items[cur];addFiles([...t.files],t.dataset.add==='cam',it);t.value=''});
$('pics').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;const it=items[cur],i=+b.dataset.rm;if(!it||it.urls.length<2)return;
  URL.revokeObjectURL(it.urls[i]);it.urls.splice(i,1);it.blobs.splice(i,1);it.imgs=null;it.comp=null;dbPut(rec(it));show()});
$('camIn').addEventListener('change',e=>{addFiles([...e.target.files],true);e.target.value=''});
$('galIn').addEventListener('change',e=>{addFiles([...e.target.files],false);e.target.value=''});
$('meals').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!items[cur])return;items[cur].meal=b.dataset.m;persist(items[cur]);show()});
when.addEventListener('change',()=>{const it=items[cur];if(!it||!when.value)return;const d=new Date(when.value);if(isNaN(d))return;const wasAuto=it.meal===autoMeal(it.date);it.date=d;if(wasAuto)it.meal=autoMeal(d);it.src='직접 수정';sortItems();cur=items.indexOf(it);persist(it);show()});
let mt;memo.addEventListener('input',()=>{const it=items[cur];if(!it)return;it.memo=memo.value;persist(it);clearTimeout(mt);mt=setTimeout(()=>draw(it),250)});
$('nowBtn').addEventListener('click',()=>{const it=items[cur];if(!it)return;it.date=new Date();it.meal=autoMeal(it.date);it.src='지금 시간';sortItems();cur=items.indexOf(it);persist(it);show()});
$('resetBtn').addEventListener('click',()=>{const it=items[cur];if(!it)return;it.date=new Date(it.orig);it.meal=autoMeal(it.date);it.src='원래 시간';sortItems();cur=items.indexOf(it);persist(it);show()});
$('shareBtn').addEventListener('click',async()=>{
  const it=items[cur],h=$('actHint');if(!it||it.sample||!outBlob)return;
  const file=new File([outBlob],fname(it),{type:'image/jpeg'});
  if(!(navigator.canShare&&navigator.canShare({files:[file]}))){h.textContent='이 브라우저는 바로 보내기를 지원하지 않아요. 저장 후 클로드에 올려 주세요.';return}
  try{await navigator.share({files:[file]});h.textContent='보냈어요. 다음 끼니도 기록해 주세요.';mood='';setBlob('happy')}
  catch(e){if(e.name!=='AbortError')h.textContent='보내기에 실패했어요. 저장 후 클로드에 올려 주세요.'}
});
histList.addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;const i=items.findIndex(t=>t.id===b.dataset.id);if(i<0)return;cur=i;show();if(innerWidth<760)document.querySelector('.prev').scrollIntoView({behavior:'smooth',block:'start'})});
$('delBtn').addEventListener('click',()=>{
  const it=items[cur],b=$('delBtn');if(!it||it.sample)return;
  if(!delArm){delArm=true;b.textContent='한 번 더 누르면 삭제돼요';return}
  dbDel(it.id);it.urls.forEach(u=>URL.revokeObjectURL(u));items.splice(cur,1);
  if(!items.length)items=[sample()];cur=Math.min(cur,items.length-1);show();
});

const sample=()=>{const d=new Date();return{img:sampleImg(),date:d,orig:new Date(d),meal:autoMeal(d),memo:'현미밥 반 공기, 닭가슴살 샐러드',src:'예시',sample:true}};
const start=async()=>{
  let recs=[];try{recs=await dbAll()||[]}catch(e){}
  const cut=Date.now()-KEEP_DAYS*864e5;
  for(const r of recs)if(r.created<cut)dbDel(r.id);
  items=recs.filter(r=>r.created>=cut&&(r.blobs||r.blob)).map(fromRec);
  sortItems();if(!items.length)items=[sample()];
  cur=0;show();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
};
const fl=document.fonts&&document.fonts.load?Promise.all(['800 40px Pretendard','600 20px Pretendard','400 20px Pretendard'].map(f=>document.fonts.load(f))).catch(()=>{}):Promise.resolve();
Promise.race([fl,new Promise(r=>setTimeout(r,2500))]).then(start,start);
}
</script>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
